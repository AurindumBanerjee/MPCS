<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">FIGURE 1: MPCS DUAL-PROCESS COGNITIVE ARCHITECTURE &amp; SEMANTIC FORAGING</text>
  <text x="480" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">Neuro-Symbolic Cognitive Loop: Reflexive Perceptual Gating vs. Deliberative Episodic Spreading Activation</text>

  <!-- Sensory Afferent Input Section -->
  <rect x="30" y="80" width="160" height="400" rx="10" fill="url(#g1)" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="92" width="140" height="28" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="110" y="111" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">AFFERENT INPUT</text>
  
  <!-- Modality channels -->
  <g transform="translate(45, 135)">
    <rect width="130" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="2,2"/>
    <text x="65" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Vision Channel</text>
    <text x="65" y="36" text-anchor="middle" fill="#64748b" font-size="9.5">Obj, Motion, Color (1.0)</text>
  </g>
  <g transform="translate(45, 195)">
    <rect width="130" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="2,2"/>
    <text x="65" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Audio Channel</text>
    <text x="65" y="36" text-anchor="middle" fill="#64748b" font-size="9.5">Sound, Intensity (0.90)</text>
  </g>
  <g transform="translate(45, 255)">
    <rect width="130" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="2,2"/>
    <text x="65" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Touch Channel</text>
    <text x="65" y="36" text-anchor="middle" fill="#64748b" font-size="9.5">Contact, Thermal (0.95)</text>
  </g>
  <g transform="translate(45, 315)">
    <rect width="130" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="2,2"/>
    <text x="65" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Smell Channel</text>
    <text x="65" y="36" text-anchor="middle" fill="#64748b" font-size="9.5">Odor, Pleasantness (0.70)</text>
  </g>

  <!-- Multimodal Binding Afferent Object -->
  <g transform="translate(45, 380)">
    <rect width="130" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Afferent Object</text>
    <text x="65" y="38" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Z-Number Tuples</text>
    <text x="65" y="54" text-anchor="middle" fill="#94a3b8" font-size="9">(value, confidence)</text>
    <text x="65" y="72" text-anchor="middle" fill="#38bdf8" font-size="9">O(d) Immutable Slot</text>
  </g>

  <!-- Connect Afferent to System 1 & System 2 -->
  <path d="M 190 422 L 245 422 L 245 200 L 270 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 245 340 L 270 340" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- SYSTEM 1: Fast Reflexive & Gating Engine -->
  <rect x="270" y="80" width="310" height="195" rx="10" fill="url(#g1)" stroke="#059669" stroke-width="2"/>
  <rect x="285" y="92" width="280" height="26" rx="5" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="425" y="110" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">SYSTEM 1: FAST SUBSYMBOLIC GATING (&lt;3 µs)</text>

  <!-- dlCBF Module -->
  <rect x="285" y="130" width="135" height="70" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="352" y="148" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">dlCBF Filter</text>
  <text x="352" y="165" text-anchor="middle" fill="#cbd5e1" font-size="9">d-left Counting Bloom</text>
  <text x="352" y="180" text-anchor="middle" fill="#94a3b8" font-size="8.5">4x1024 Buckets, 16-bit</text>
  <text x="352" y="193" text-anchor="middle" fill="#6ee7b7" font-size="8">Latency: 27 µs | 8.3 KB</text>

  <!-- HyST Module -->
  <rect x="430" y="130" width="135" height="70" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <text x="497" y="148" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">HyST Slot Gate</text>
  <text x="497" y="165" text-anchor="middle" fill="#cbd5e1" font-size="9">Hard vs Soft Split</text>
  <text x="497" y="180" text-anchor="middle" fill="#94a3b8" font-size="8.5">Ordinal Closeness Kernel</text>
  <text x="497" y="193" text-anchor="middle" fill="#6ee7b7" font-size="8">Prunes 98% Candidates</text>

  <!-- Reflex Rules Execution -->
  <rect x="285" y="210" width="280" height="50" rx="6" fill="#132e27" stroke="#10b981" stroke-width="1"/>
  <text x="425" y="228" text-anchor="middle" fill="#a7f3d0" font-size="10.5" font-weight="600">Deterministic Reflex Execution</text>
  <text x="425" y="246" text-anchor="middle" fill="#6ee7b7" font-size="9">Thermal/Impact/Alarm -&gt; Immediate Alert/Withdrawal (0 µs Deliberation)</text>

  <!-- Damasio Somatic Marker & Affect Modulation -->
  <rect x="270" y="290" width="310" height="190" rx="10" fill="url(#g1)" stroke="#d97706" stroke-width="1.8"/>
  <rect x="285" y="302" width="280" height="26" rx="5" fill="#451a03" stroke="#d97706" stroke-width="1"/>
  <text x="425" y="320" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">DAMASIO SOMATIC MARKER ENGINE (VAD)</text>

  <!-- VAD Vector Box -->
  <rect x="285" y="340" width="135" height="125" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="352" y="358" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="700">3D Affect State</text>
  <text x="352" y="378" text-anchor="middle" fill="#fed7aa" font-size="9.5">Valence: [0.0, 1.0]</text>
  <text x="352" y="394" text-anchor="middle" fill="#94a3b8" font-size="8.5">Distress &lt;-&gt; Well-being</text>
  <text x="352" y="412" text-anchor="middle" fill="#fed7aa" font-size="9.5">Arousal: [0.0, 1.0]</text>
  <text x="352" y="428" text-anchor="middle" fill="#94a3b8" font-size="8.5">Torpor &lt;-&gt; Panic/Frenzy</text>
  <text x="352" y="446" text-anchor="middle" fill="#fed7aa" font-size="9.5">Dominance: [0.0, 1.0]</text>

  <!-- Modulating Weight & Salience -->
  <rect x="430" y="340" width="135" height="125" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="497" y="358" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="700">Salience Injection</text>
  <text x="497" y="380" text-anchor="middle" fill="#fde68a" font-size="9.5">Seed Gain Equation:</text>
  <text x="497" y="398" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">S = S0 * (1 + 0.8 * A)</text>
  <text x="497" y="420" text-anchor="middle" fill="#fde68a" font-size="9.5">Cognitive Domain:</text>
  <text x="497" y="438" text-anchor="middle" fill="#94a3b8" font-size="8.5">Hyperarousal, Grief,</text>
  <text x="497" y="452" text-anchor="middle" fill="#94a3b8" font-size="8.5">Delirium, Obsessive</text>

  <!-- Connecting System 1 & Damasio to System 2 -->
  <path d="M 580 180 L 630 180" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 580 400 L 610 400 L 610 320 L 630 320" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- SYSTEM 2: TIDE Deliberative Graph Activation & Patch Foraging -->
  <rect x="630" y="80" width="300" height="400" rx="10" fill="url(#g1)" stroke="#7c3aed" stroke-width="2"/>
  <rect x="645" y="92" width="270" height="26" rx="5" fill="#3b0764" stroke="#7c3aed" stroke-width="1"/>
  <text x="780" y="110" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">SYSTEM 2: DELIBERATIVE FORAGING (TIDE)</text>

  <!-- Spreading Activation Engine -->
  <rect x="645" y="130" width="270" height="105" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
  <text x="780" y="150" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Spreading Activation Recurrence</text>
  <text x="780" y="168" text-anchor="middle" fill="#e9d5ff" font-size="9.5">Hops = 3 | Decay γ = 0.50 | Recency Power = 0.20</text>
  <text x="780" y="186" text-anchor="middle" fill="#cbd5e1" font-size="9">Typed Edges: Prev (0.5), Action (0.7), Object (1.0), Place (1.0)</text>
  <text x="780" y="204" text-anchor="middle" fill="#f472b6" font-size="9">Floor Prune: Cutoff = 0.05 * Max(Seed) | Max Active: 80</text>
  <text x="780" y="222" text-anchor="middle" fill="#a855f7" font-size="8.5">Anytime Budget B in {3, 5, 10, 20, 50, full} (1.25 - 1.54 ms)</text>

  <!-- Hills Semantic Foraging Dual Persona -->
  <rect x="645" y="248" width="270" height="145" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
  <text x="780" y="268" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="700">Hills et al. Semantic Patch Foraging</text>
  
  <!-- Confident Exploitation -->
  <rect x="655" y="280" width="120" height="100" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="715" y="298" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">Confident Persona</text>
  <text x="715" y="315" text-anchor="middle" fill="#67e8f9" font-size="8.5">[Patch Exploitation]</text>
  <text x="715" y="332" text-anchor="middle" fill="#cbd5e1" font-size="8">θ_conf = 0.45 * Max(A)</text>
  <text x="715" y="348" text-anchor="middle" fill="#94a3b8" font-size="8">Noise Pruned: &gt;99%</text>
  <text x="715" y="366" text-anchor="middle" fill="#34d399" font-size="8">Acute Triage Precision</text>

  <!-- Exploratory Exploration -->
  <rect x="785" y="280" width="120" height="100" rx="4" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
  <text x="845" y="298" text-anchor="middle" fill="#f472b6" font-size="9.5" font-weight="700">Exploratory Persona</text>
  <text x="845" y="315" text-anchor="middle" fill="#fbcfe8" font-size="8.5">[Patch Traversal]</text>
  <text x="845" y="332" text-anchor="middle" fill="#cbd5e1" font-size="8">θ_expl = 0.18 * Max(A)</text>
  <text x="845" y="348" text-anchor="middle" fill="#94a3b8" font-size="8">Cross-Remedy Links</text>
  <text x="845" y="366" text-anchor="middle" fill="#fbbf24" font-size="8">Chronic Differential</text>

  <!-- Feedback Passive Net -->
  <rect x="645" y="405" width="270" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="780" y="424" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="600">Asynchronous Passive Safety Thread</text>
  <text x="780" y="442" text-anchor="middle" fill="#94a3b8" font-size="8.5">Background full read verification | Counterfactual Agreement: 73.2%</text>
  <text x="780" y="456" text-anchor="middle" fill="#34d399" font-size="8.5">Unsafe Action Rate: 1.2% Invariant across all budgets</text>
</svg>
